name: Surveillance

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub peut retarder les crons de 5 à 30 min aux heures chargées
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation (rien n'est envoyé ni enregistré)"
        type: boolean
        default: false

permissions:
  contents: write   # pousser l'état sur la branche « donnees »
  pages: write
  id-token: write

concurrency:
  group: surveillance
  cancel-in-progress: false

jobs:
  passage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances
        run: pip install -r requirements.txt playwright

      - name: Cache Chromium (Playwright)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Chromium headless
        run: python -m playwright install --with-deps chromium

      - name: Restaurer l'état (branche donnees)
        run: |
          if git fetch --depth=1 origin donnees 2>/dev/null; then
            git checkout FETCH_HEAD -- data
            echo "état restauré"
          else
            echo "premier passage : pas encore d'état"
          fi

      - name: Passage de surveillance
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m pokerestock run --dry-run
          else
            python -m pokerestock run
          fi

      - name: Sauvegarder l'état (branche donnees, un seul commit)
        if: ${{ !inputs.dry_run }}
        run: |
          tmp=$(mktemp -d)
          cp -r data "$tmp/"
          cd "$tmp"
          git init -q -b donnees
          git config user.name "pokerestock-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -q -m "état $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" donnees

      - name: Préparer le tableau de bord
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publier sur GitHub Pages
        if: ${{ !inputs.dry_run }}
        id: pages
        uses: actions/deploy-pages@v4
