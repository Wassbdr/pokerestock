# Produits surveillés.
# - plafond : prix maximum accepté (€). Au-dessus -> état « trop_cher », pas d'alerte.
# - priorite : « chaud » = notification priorité maximale + vérifié plus souvent.
# - mots_cles : chaque phrase est un ensemble de mots qui doivent TOUS apparaître
#   (sans tenir compte des accents ni des majuscules) pour qu'une annonce ou une
#   fiche découverte soit rattachée au produit.
# - exclure : mots qui écartent une annonce (ex. « display » pour un bundle).
# - urls : fiches connues par enseigne (clé = nom dans enseignes.yaml).
# - secours : pages d'agrégateurs suivies pour ce produit.

